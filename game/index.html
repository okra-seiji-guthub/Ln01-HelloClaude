<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>落ちものパズル</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>落ちものパズル</h1>

<div class="game-wrap">
  <canvas id="board" width="240" height="480"></canvas>

  <div class="side-panel">
    <div class="panel-box">
      <h2>スコア</h2>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel-box">
      <h2>ライン</h2>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel-box">
      <h2>レベル</h2>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel-box">
      <h2>ネクスト</h2>
      <canvas id="nextCanvas" width="100" height="100"></canvas>
    </div>
    <div class="panel-box controls">
      ← → : 移動<br>
      ↓ : ソフトドロップ<br>
      ↑ : 回転<br>
      Space : ハードドロップ<br>
      P : 一時停止
    </div>
    <button id="restartBtn">最初から</button>
  </div>
</div>

<div id="overlay">
  <h2 id="overlayText">GAME OVER</h2>
  <button id="overlayBtn">もう一度プレイ</button>
</div>

<script src="src/game.js"></script>
</body>
</html>
